name: Android Build & Release CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK & AAB Packages
        run: gradle assembleDebug assembleRelease bundleDebug bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyInvoicer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyInvoicer-Release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore

      - name: Upload Debug AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyInvoicer-Debug-AAB
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: ignore

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyInvoicer-Release-AAB
          path: app/build/outputs/bundle/release/app-release-unsigned.aab
          if-no-files-found: ignore

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/debug/app-debug.aab
            app/build/outputs/bundle/release/app-release-unsigned.aab
          generate_release_notes: true
